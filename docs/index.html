dia(min-width:800px){.newsgroup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.newsgroup .card{margin:0}.paper-item{min-width:0}}@media(max-width:600px){.bar{align-items:stretch}.bar select{flex:1}h1{font-size:22px}}
</style></head><body><header><h1>三紙ニュース</h1><p>朝日・毎日・読売｜政治・経済・国際｜自動比較・48時間の履歴照合</p></header><main>
<div class="switch" role="group" aria-label="表示方法"><button data-view="list" aria-pressed="true">記事一覧</button><button data-view="compare" aria-pressed="false">三紙比較</button></div>
<div class="switch" role="group" aria-label="分野"><button data-cat="政治" aria-pressed="true">政治</button><button data-cat="経済" aria-pressed="false">経済</button><button data-cat="国際" aria-pressed="false">国際</button></div>
<div class="bar"><label for="edition">閲覧する配信</label><select id="edition"><option value="latest.json">自動取得の最新版</option><option value="snapshot-20261016-1700.json">10月16日 17:00 試作</option></select><label for="paper">新聞</label><select id="paper"><option>すべて</option><option>朝日</option><option>毎日</option><option>読売</option></select></div>
<div id="notice-area"></div><div id="results"></div><p class="disclaimer">元記事にリンクできるのはURL確認済みの記事のみ。同一事件比較は最大48時間の履歴から見出し・公開説明・日時を照合した自動候補抽出です。誤判定の可能性があるため、各記事を開いて確認してください。本文全体の論調は推測しません。</p>
</main><script>
'use strict';
'use strict';
/* Conservative cross-paper comparison of public headlines and summaries. */
const CompareEngine = (() => {
  const publishers = /[（(]\s*(?:読売新聞オンライン|毎日新聞|朝日新聞|読売新聞)\s*[）)]|\s*[-－]\s*(?:毎日新聞|読売新聞オンライン|朝日新聞)\s*$/g;
  function normalize(x) { return String(x||'').normalize('NFKC').toLowerCase().replace(publishers,'').replace(/文部科学相|文部科学大臣/g,'文科相').replace(/農林水産相|農水相/g,'農相').replace(/簗前農相|簗氏/g,'簗農相').replace(/北海道新聞の記者/g,'北海道新聞記者').replace(/[\s「」『』（）()\[\]【】,.、。・\-―—!?！？:：]/g,''); }
  const anchors = [
    ['関文科相',/関(?:文科相|文部科学相|文部科学大臣)/],
    ['簗農相',/簗(?:農相|農水相|前農相|氏|和生)|簗農相/],
    ['ニデック',/ニデック/],['永守',/永守/],['北海道新聞',/北海道新聞/],
    ['TSMC',/tsmc|台湾積体電路/],['熊本第二工場',/熊本第?[2二]工場/],
    ['G7欠席',/G7.{0,24}(?:欠席|不参加)|(?:欠席|不参加).{0,24}G7/i],
    ['プレミアム商品券',/プレミアム商品券/],['日銀',/日本銀行|日銀/],
    ['みずほ',/みずほ/],['ソースネクスト',/ソースネクスト/],['タイムズカー',/タイムズカー/],
    ['原子力潜水艦',/原子力潜水艦|原潜/],['国際刑事裁判所',/国際刑事裁判所|ICC/i],
    ['チョルノービリ原発',/チョルノービリ|チェルノブイリ/],
    ['兵庫県議補選',/兵庫県議.{0,6}(?:補選|補欠選挙)|片山安孝|島津明香/],
    ['防衛費GDP比',/GDP比.?3.?5|防衛費.{0,15}GDP/],
    ['日本郵便',/日本郵便/],['トヨタ',/トヨタ/],['ホンダ',/ホンダ/],
    ['植田総裁',/植田.{0,5}総裁/],['パジェロ',/パジェロ/]
  ];
  const events = [
    ['厳重注意',/厳重注意/],['議員会館パーティー',/議員会館.{0,20}パーティー|パーティー.{0,20}議員会館/],
    ['政治資金パーティー',/政治資金パーティー/],
    ['閣僚更迭',/更迭|農相.{0,6}(?:辞任|交代)|農相.{0,10}任命責任|前農相|後任を選ぶ/],
    ['任命責任',/任命責任/],['会議欠席',/欠席|不参加|回線が間に合わ/],
    ['記者拘束',/記者.{0,12}拘束|拘束.{0,12}記者|領事通報/],
    ['不正会計',/不正会計|粉飾決算/],['損害賠償',/損害賠償|提訴/],
    ['金融政策',/政策金利|利上げ|金利引き上げ/],
    ['生産計画',/製造|工場|生産|半導体/],
    ['商品券',/プレミアム商品券|GoTo|消費減税.*外食|外食.*消費減税/],
    ['情報流出',/情報流出|個人情報流出|顧客情報漏えい|不正アクセス/],
    ['原潜導入',/原子力潜水艦|原潜/],
    ['選挙立候補',/立候補|県議補選|補欠選挙/],
    ['資金制裁',/制裁|国際刑事裁判所|ICC/],
    ['原発修復',/原発.{0,10}修復|修復.{0,10}原発/]
  ];
  const rareTopics = new Set(['関文科相','簗農相','ニデック','永守','北海道新聞','TSMC','熊本第二工場','G7欠席','プレミアム商品券','原子力潜水艦','兵庫県議補選','チョルノービリ原発','タイムズカー','ソースネクスト','防衛費GDP比','日本郵便','国際刑事裁判所','植田総裁']);
  const strongEvents = new Set(['厳重注意','議員会館パーティー','閣僚更迭','記者拘束','不正会計','損害賠償','会議欠席','商品券','原潜導入','原発修復']);
  const focus = ['政治資金パーティー','厳重注意','議員会館','内規違反','任命責任','後任','更迭','辞任','謝罪','続投','会合欠席','回線','領事通報','記者拘束','損害賠償','不正会計','提訴','政策金利','利上げ','消費減税','外食産業','プレミアム商品券','原子力潜水艦','導入','修復','資金支援','立候補','説明責任'];
  function tags(input, definitions) {const result=new Set(); for(const [key,r] of definitions){r.lastIndex=0;if(r.test(input))result.add(key)}return result;}
  function intersect(a,b){return [...a].filter(x=>b.has(x));}
  function ngrams(s,n){const o=new Set();for(let i=0;i<=s.length-n;i++)o.add(s.slice(i,i+n));return o;}
  function prepare(article){const title=normalize(article.title);const body=normalize(article.description).slice(0,240);const text=title+'。'+body;return {...article,_title:title,_text:text,_anchors:tags(text,anchors),_headlineAnchors:tags(title,anchors),_events:tags(text,events),_grams:ngrams(title,4)};}
  function pair(a,b){
    if(a.paper===b.paper)return 0;
    const time1=Date.parse(a.published),time2=Date.parse(b.published);
    if(Number.isFinite(time1)&&Number.isFinite(time2)&&Math.abs(time1-time2)>72*3600*1000)return 0;
    const commonAnchors=intersect(a._anchors,b._anchors).filter(x=>rareTopics.has(x));
    const titleAnchors=intersect(a._headlineAnchors,b._headlineAnchors).filter(x=>rareTopics.has(x));
    const commonEvents=intersect(a._events,b._events);
    const strong=commonEvents.filter(x=>strongEvents.has(x));
    const titleCommon=[...a._grams].filter(x=>b._grams.has(x));
    const overlap=titleCommon.length/Math.max(1,Math.min(a._grams.size,b._grams.size));
    // Only a named subject in both public accounts or highly distinctive shared headline
    // phrasing establishes same-event evidence. General politicians/parties never suffice.
    if(!commonAnchors.length && !(strong.length && titleCommon.length>=5 && overlap>=.24))return 0;
    if(!commonEvents.length && !(titleAnchors.length && overlap>=.30))return 0;
    if(!strong.length && overlap<.23 && !(titleAnchors.length&&commonEvents.length>=2))return 0;
    if(!titleAnchors.length && titleCommon.length<2 && !strong.length)return 0;
    return commonAnchors.length*5 + titleAnchors.length*3 + strong.length*4 + commonEvents.length*1.5 + Math.min(12,titleCommon.length)*.7 + overlap*8;
  }
  function differences(group){
    let findings=[];
    for(const a of group){
      const other=group.filter(x=>x!==a).map(x=>normalize(x.title)).join('|');
      let keys=focus.filter(s=>a._title.includes(normalize(s))&&!other.includes(normalize(s)));
      if(keys.length)findings.push(`${a.paper}は見出しで「${keys.slice(0,2).join('・')}」に言及`);
    }
    if(findings.length>=2)return '見出しの焦点：'+findings.join('、')+'。記事本文全体の論調を評価したものではありません。';
    if(findings.length)return findings.join('。')+'。他紙が同じ点に触れていないとは限りません。';
    return '同一事件を扱う候補です。公開見出しだけから各紙の着眼点の違いは断定できません。';
  }
  function build(raw){
    const seen=new Map();
    for(const a of raw||[]){
      if(!a||!a.paper||!a.title||!['朝日','毎日','読売'].includes(a.paper))continue;
      const norm=normalize(a.title);
      const id=a.paper+'|'+(a.url||norm);
      const old=seen.get(id);
      if(!old||String(a.description||'').length>String(old.description||'').length)seen.set(id,a);
    }
    const all=[...seen.values()].map(prepare);
    let pairs=[];
    for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
      const score=pair(all[i],all[j]);if(score>=12)pairs.push({i,j,score});
    }
    pairs.sort((a,b)=>b.score-a.score);
    const reserved=new Set(),groups=[];
    for(const p of pairs){
      if(reserved.has(p.i)||reserved.has(p.j))continue;
      const ix=[p.i,p.j];
      for(let k=0;k<all.length;k++){
        if(reserved.has(k)||ix.includes(k)||ix.some(i=>all[i].paper===all[k].paper))continue;
        if(ix.every(i=>pair(all[i],all[k])>=12))ix.push(k);
      }
      ix.forEach(i=>reserved.add(i));
      let items=ix.map(i=>all[i]).sort((a,b)=>['朝日','毎日','読売'].indexOf(a.paper)-['朝日','毎日','読売'].indexOf(b.paper));
      let title=items.map(a=>String(a.title).replace(publishers,'')).sort((a,b)=>a.length-b.length)[0];
      let categories=[...new Set(items.map(x=>x.category))];
      groups.push({category:categories[0],categories,topic:title,items:items.map(a=>[a.paper,a.title]),articles:items.map(a=>{let {_title,_text,_anchors,_headlineAnchors,_events,_grams,...rest}=a;return rest}),analysis:differences(items),automatic:true});
    }
    return groups;
  }
  return {build,pair,normalize};
})();
if(typeof module!=='undefined')module.exports=CompareEngine;

const state={view:'list',cat:'政治',paper:'すべて',data:null,pool:[],historyCount:0,comparisons:[]};
let edition=document.getElementById('edition');
const R=document.getElementById('results'),N=document.getElementById('notice-area');
function e(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n;}
function fmt(t){if(!t||t==='確認できず')return '確認できず';let d=new Date(t);return Number.isNaN(+d)?t:d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function head(a){let h=e('h3');if(a.url&&/^https:\/\//.test(a.url)){let l=e('a','',a.title);l.href=a.url;l.target='_blank';l.rel='noopener noreferrer';h.append(l);}else h.textContent=a.title+'（リンク未確認）';return h;}
function articleNode(a){let n=e('div','paper-item');n.append(head(a),e('p','description',a.description||'確認できず'),e('div','small',`公開日時：${fmt(a.published)} ／ 有料表示：${a.paid||'確認できず'}${a.paper==='読売'?' ／ Yahoo配信情報':''}`));return n;}
function render(){
  if(!state.data)return;const d=state.data;N.replaceChildren();R.replaceChildren();
  N.append(e('div','notice',d.snapshot?'これは10月16日17時のチャット配信を再構成した試作です。元記事・公開日時・有料区分は再検証していません。':`取得日時：${fmt(d.fetched_at)}（日本時間）。ニュース比較は最新号と直近48時間の取得履歴を対象とし、同一事件の根拠を確認できる記事だけを表示します。`));
  if(d.errors?.length){let details=e('details','card');details.append(e('summary','','取得上の問題・未確認事項'));d.errors.forEach(x=>details.append(e('p','small',`${x.paper}：${x.reason}`)));N.append(details);}
  const papers=['朝日','毎日','読売'].filter(p=>state.paper==='すべて'||state.paper===p);
  const articles=(d.articles||[]).filter(x=>x.category===state.cat&&papers.includes(x.paper));
  if(state.view==='list'){
    for(const p of papers){const sec=e('section','card');const aa=articles.filter(x=>x.paper===p);sec.append(e('h2','paper-title',p+'新聞　'+aa.length+'本'));if(!aa.length)sec.append(e('p','empty','該当記事なし／取得できず'));aa.forEach(a=>sec.append(articleNode(a)));R.append(sec);}return;
  }
  let comparisons=(d.snapshot?(d.comparisons||[]):state.comparisons).filter(x=>(x.categories||[x.category]).includes(state.cat)&&x.items.some(i=>papers.includes(i[0])));
  if(!d.snapshot)N.append(e('p','small',`比較の照合対象：${state.pool.length}記事（直近${state.historyCount}回の取得履歴を含む）。最新号の一覧は「記事一覧」から確認できます。`));
  if(!comparisons.length){R.append(e('div','card',d.snapshot?'この分野で照合できる同一テーマの比較はありません。記事一覧を参照してください。':'直近48時間の公開見出し・説明を照合しましたが、別の新聞の同一事件と確認できる記事はありませんでした。条件を緩めて別の事件を結びつけることはしません。記事一覧は表示できます。'));return;}
  for(let group of comparisons){const sec=e('section','group');sec.append(e('div','small',state.cat+'｜'+(group.automatic?'同一事件の自動照合候補':'共通テーマ')),e('h3','',group.topic));for(let [p,title] of group.items){if(!papers.includes(p))continue;let a=group.articles?.find(x=>x.paper===p&&x.title===title) || articles.find(x=>x.paper===p&&x.title===title);let n=e('div','compare-paper');n.append(e('strong','',p+'新聞'));if(a)n.append(head(a),e('p','description',a.description||'確認できず'),e('div','small',`公開日時：${fmt(a.published)} ／ 有料表示：${a.paid||'確認できず'}${a.paper==='読売'?' ／ Yahoo配信日時':''}`));else n.append(e('p','small','記事を確認できず'));sec.append(n);}if(state.paper==='すべて')sec.append(e('div','analysis','焦点の違い：'+group.analysis));R.append(sec);}
  R.append(e('p','small','※ 掲載時刻に差があるため、直近48時間の履歴も照合します。自動判定には誤照合の可能性があります。新聞間の論調を推測したものではありません。'));
}
async function getJSON(path){const resp=await fetch('data/'+path+'?v='+Date.now(),{cache:'no-store'});if(!resp.ok)throw Error(`HTTP ${resp.status}: ${path}`);return await resp.json();}
async function historyPool(latest){
  const now=Date.parse(latest.fetched_at||'');let all=[...(latest.articles||[])],count=0;
  try{
    const index=await getJSON('index.json');if(!Array.isArray(index))return {articles:all,count};
    const relevant=index.filter(x=>x&&typeof x.file==='string'&&/^history\/\d{8}_\d{4}\.json$/.test(x.file)&&(!Number.isFinite(now)||!Number.isFinite(Date.parse(x.fetched_at))||(now-Date.parse(x.fetched_at)>=0&&now-Date.parse(x.fetched_at)<=48*3600*1000))).slice(0,12);
    const past=await Promise.allSettled(relevant.map(x=>getJSON(x.file)));
    for(const p of past){if(p.status==='fulfilled'&&Array.isArray(p.value.articles)){all.push(...p.value.articles);count++;}}
  }catch(error){console.warn('履歴取得失敗。最新版だけ照合',error);}
  const seen=new Map();for(const a of all){if(!a||!a.paper||!a.title)continue;let key=a.paper+'|'+(a.url||CompareEngine.normalize(a.title));const old=seen.get(key);if(!old||String(a.description||'').length>String(old.description||'').length)seen.set(key,a);}return {articles:[...seen.values()],count};
}
async function load(){
  try{
    R.replaceChildren(e('div','card','記事データを読み込んでいます。'));
    const selected=edition.value,d=await getJSON(selected);
    // Never silently compare an old edition with newly fetched data.
    let pool={articles:d.articles||[],count:0};
    if(!d.snapshot&&selected==='latest.json')pool=await historyPool(d);
    if(edition.value!==selected)return;
    state.data=d;state.pool=pool.articles;state.historyCount=pool.count;state.comparisons=d.snapshot?[]:CompareEngine.build(pool.articles);render();
  }catch(err){R.replaceChildren(e('div','notice','データを読み込めませんでした：'+err.message));}
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;if(state.view==='compare'&&state.paper!=='すべて'){state.paper='すべて';document.getElementById('paper').value='すべて';}document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
document.getElementById('paper').onchange=x=>{state.paper=state.view==='compare'?'すべて':x.target.value;if(state.view==='compare')x.target.value='すべて';render();};
edition.onchange=load;load();

</script></body></html>
