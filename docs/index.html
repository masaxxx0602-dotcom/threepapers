<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b40"><title>三紙ニュース｜記事一覧と比較</title><style>
:root{font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#192a3a;background:#f3f5f8}*{box-sizing:border-box}body{margin:0}header{background:#172b40;color:white;padding:22px max(18px,calc((100vw - 920px)/2))}h1{margin:0;font-size:24px}header p{margin:3px 0;color:#c9d5e0;font-size:13px}main{max-width:956px;margin:auto;padding:18px 18px 60px}.switch{display:flex;gap:6px;margin:12px 0}.switch button{flex:1}button,select{font:inherit;background:#fff;border:1px solid #cad5df;border-radius:10px;padding:9px 12px;cursor:pointer;color:#253d52}button[aria-pressed="true"]{background:#193d5d;color:white;border-color:#193d5d;font-weight:700}.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}.bar label{font-size:13px}select{max-width:100%}.notice{border-left:4px solid #b78349;background:#fff7ed;padding:12px 15px;border-radius:8px;font-size:13px;line-height:1.8}.card,.group{background:#fff;border:1px solid #dce3e9;border-radius:13px;margin:12px 0;padding:16px;box-shadow:0 2px 12px #0c2a4306}.card h3,.group h3{margin:0 0 7px;font-size:17px}.description{margin:5px 0 10px;color:#4c5d6b;font-size:14px}.byline{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:#657786;margin-bottom:7px}.small{font-size:12px;color:#72808e}.pill{border-radius:6px;background:#edf1f6;padding:2px 7px;font-size:11px}.paper-title{font-size:19px;margin:24px 0 4px}.paper-item{border-top:1px solid #e7ebef;padding:12px 0}.paper-item:first-of-type{border-top:0}.paper-item h3{font-size:16px;margin:0 0 4px}.paper-item a{color:#12568e;text-decoration:none}.paper-item a:hover{text-decoration:underline}.compare-paper{border-top:1px solid #e5e9ee;padding:12px 0}.compare-paper strong{font-size:13px;color:#446174}.analysis{border-top:1px solid #ccd6df;margin-top:5px;padding-top:12px;font-size:14px}.empty{padding:15px;color:#75818a}.disclaimer{font-size:12px;color:#637487;margin-top:23px}#notice-area{margin-top:12px}@media(min-width:800px){.newsgroup{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.newsgroup .card{margin:0}.paper-item{min-width:0}}@media(max-width:600px){.bar{align-items:stretch}.bar select{flex:1}h1{font-size:22px}}
</style></head><body><header><h1>三紙ニュース</h1><p>朝日・毎日・読売｜政治・経済・国際</p></header><main>
<div class="switch" role="group" aria-label="表示方法"><button data-view="list" aria-pressed="true">記事一覧</button><button data-view="compare" aria-pressed="false">三紙比較</button></div>
<div class="switch" role="group" aria-label="分野"><button data-cat="政治" aria-pressed="true">政治</button><button data-cat="経済" aria-pressed="false">経済</button><button data-cat="国際" aria-pressed="false">国際</button></div>
<div class="bar"><label for="edition">閲覧する配信</label><select id="edition"><option value="snapshot-20261016-1700.json">10月16日 17:00 試作</option><option value="latest.json">自動取得の最新版</option></select><label for="paper">新聞</label><select id="paper"><option>すべて</option><option>朝日</option><option>毎日</option><option>読売</option></select></div>
<div id="notice-area"></div><div id="results"></div><p class="disclaimer">公開見出し・説明のみ。元記事の確認が済んでいない記事はリンクを表示しません。将来の取得分は確認できたURLにリンクします。記事の内容や紙面の重要度を推測して補いません。</p>
</main><script>
const state={view:'list',cat:'政治',paper:'すべて',data:null};let edition=document.getElementById('edition');const R=document.getElementById('results');const N=document.getElementById('notice-area');function e(t,c,x){let n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}function fmt(t){if(!t||t==='確認できず')return '確認できず';let d=new Date(t);return Number.isNaN(+d)?t:d.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function head(article){let h=e('h3');if(article.url&&/^https:\/\//.test(article.url)){let a=e('a','',article.title);a.href=article.url;a.target='_blank';a.rel='noopener noreferrer';h.append(a)}else h.textContent=article.title+'（リンク未確認）';return h}function articleNode(a){let n=e('div','paper-item');n.append(head(a),e('p','description',a.description||'確認できず'),e('div','small',`公開日時：${fmt(a.published)} ／ 有料表示：${a.paid||'確認できず'}${a.paper==='読売'?' ／ Yahoo配信情報':''}`));return n}function render(){if(!state.data)return;const d=state.data;N.replaceChildren();R.replaceChildren();const warning=e('div','notice',d.snapshot?'これは10月16日17時のチャット配信を再構成した試作です。元記事・公開日時・有料区分の再検証は行っていません。実際に検証できた最新ニュースとは区別してください。':`取得日時：${fmt(d.fetched_at)}（日本時間）。取得エラーは画面に記載します。`);N.append(warning);if(d.errors?.length){let details=e('details','card');details.append(e('summary','','取得上の問題・未確認事項'));d.errors.forEach(x=>details.append(e('p','small',`${x.paper}：${x.reason}`)));N.append(details)}let papers=['朝日','毎日','読売'].filter(p=>state.paper==='すべて'||state.paper===p);let articles=(d.articles||[]).filter(x=>x.category===state.cat&&papers.includes(x.paper));if(state.view==='list'){for(let p of papers){let sec=e('section','card');const aa=articles.filter(x=>x.paper===p);sec.append(e('h2','paper-title',p+'新聞　'+aa.length+'本'));if(!aa.length)sec.append(e('p','empty','該当記事なし／取得できず'));aa.forEach(a=>sec.append(articleNode(a)));R.append(sec)}return}let comparisons=(d.comparisons||[]).filter(x=>x.category===state.cat&&x.items.some(i=>papers.includes(i[0])));if(!comparisons.length){R.append(e('div','card',d.snapshot?'この分野で照合できる同一テーマの比較はありません。記事一覧を参照してください。':'同一ニュースとして確認できる記事がありません。比較は自動的には生成しません。'));return}for(let group of comparisons){let sec=e('section','group');sec.append(e('div','small',state.cat+'｜共通テーマ'),e('h3','',group.topic));for(let [p,title] of group.items){if(!papers.includes(p))continue;let a=articles.find(x=>x.paper===p&&x.title===title);let n=e('div','compare-paper');n.append(e('strong','',p+'新聞'));if(a)n.append(head(a),e('p','description',a.description),e('div','small',`公開日時：${fmt(a.published)} ／ 有料表示：${a.paid}`));else n.append(e('p','small','記事を取得できず'));sec.append(n)}if(state.paper==='すべて')sec.append(e('div','analysis','各紙の焦点の違い：'+group.analysis));R.append(sec)}let note=e('p','small','※ 三紙が揃わない場合も、確認できた二紙のみを表示します。比較不能な見出しは記事一覧に残します。');R.append(note)}async function load(){try{let r=await fetch('data/'+edition.value+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);state.data=await r.json();render()}catch(err){R.replaceChildren(e('div','notice','データを読み込めませんでした：'+err.message))}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});document.getElementById('paper').onchange=x=>{state.paper=x.target.value;render()};edition.onchange=load;load();
</script></body></html>
