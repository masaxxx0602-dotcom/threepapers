<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#172b40">
<title>三紙ニュース｜朝日・毎日・讀賣</title>
<style>
  :root {font-family: -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif; font-size:15px; color:#182d40; background:#f2f5f8; line-height:1.7;}
  * {box-sizing:border-box}
  body {margin:0}
  .site-header {background:#172b40;color:white}
  .site-header-inner {max-width:1450px;margin:auto;padding:20px 24px 18px}
  h1 {font-size:26px;margin:0;font-weight:750;letter-spacing:.02em}
  .site-subtitle {color:#cbd7e2;margin:2px 0 0;font-size:13px}
  main {max-width:1450px;margin:0 auto;padding:20px 22px 54px}
  .toolbar {display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .categories {display:flex;gap:7px;flex:1 1 360px;max-width:600px}
  button,select {font:inherit;color:#19374f;background:white;border:1px solid #cbd7e2;border-radius:9px;padding:10px 14px}
  button {cursor:pointer}
  button:focus-visible,select:focus-visible,a:focus-visible {outline:3px solid #267db4;outline-offset:2px}
  .categories button {flex:1;font-weight:600}
  .categories button[aria-pressed="true"] {color:#fff;background:#1b4363;border-color:#1b4363}
  .edition-wrap {display:flex;align-items:center;gap:9px;font-size:13px}
  #edition {font-size:13px;min-width:170px;max-width:min(430px,75vw);padding:10px}
  .notice {padding:11px 14px;border-radius:9px;background:#fdf5e9;border-left:4px solid #bb8644;margin:12px 0 14px;font-size:13px}
  .notice strong {font-weight:750}
  .hint {margin:8px 0;color:#5b7183;font-size:13px}
  .sheet {background:#fff;border:1px solid #d7e1e9;border-radius:12px;overflow:hidden;box-shadow:0 2px 14px rgba(23,43,64,.035)}
  .sheet-scroll {overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
  table {border-collapse:collapse;width:100%;min-width:870px;table-layout:fixed}
  thead th {position:sticky;top:0;z-index:1;text-align:left;padding:13px 17px;background:#e9f0f6;color:#1b3b57;font-size:18px;border-bottom:2px solid #b9cbd9}
  thead th:nth-child(2){background:#eff2f6}
  thead th:nth-child(3){background:#e8eef5}
  thead th+th, tbody td+td {border-left:1px solid #dbe4ec}
  .count {font-size:12px;font-weight:500;color:#587085;margin-left:8px}
  tbody td {padding:14px 17px 16px;vertical-align:top;border-bottom:1px solid #e7edf2;width:33.333%;overflow-wrap:anywhere}
  tbody tr:last-child td {border-bottom:0}
  tbody tr:nth-child(even) td {background:#fbfcfd}
  .story-title {font-size:15px;line-height:1.55;font-weight:750;margin:0 0 6px}
  .story-title a {color:#075b94;text-decoration:none}
  .story-title a:hover {text-decoration:underline}
  .summary {font-size:13px;color:#394f60;margin:0 0 9px;line-height:1.7}
  .meta {font-size:11.5px;color:#687f91;line-height:1.6}
  .empty {font-size:13px;color:#607689;padding:15px 0}
  .info {font-size:12px;color:#647789;margin-top:15px;line-height:1.75}
  details {border:1px solid #d8e2e9;background:#fff;border-radius:9px;margin:10px 0 12px;padding:9px 13px}
  details summary {cursor:pointer;font-size:13px;font-weight:600}
  details p {font-size:12px;color:#526a7b;margin:8px 0}
  .error {padding:18px;background:#fff4eb;color:#8a3d20;border-radius:10px}
  .loading {padding:24px;color:#5a7183}
  @media (max-width: 700px) {
    h1 {font-size:23px}
    .site-header-inner{padding:16px}
    main{padding:14px 12px 34px}
    .toolbar{gap:10px}
    .categories{flex-basis:100%;gap:5px}
    .categories button{padding:11px 8px}
    .edition-wrap{width:100%;justify-content:space-between}
    #edition{max-width:68vw;flex:1}
    table{min-width:870px}
    .hint{font-weight:600}
  }
  @media (prefers-reduced-motion: reduce) { * {scroll-behavior:auto!important} }
</style>
</head>
<body>
<header class="site-header"><div class="site-header-inner">
<h1>三紙ニュース</h1>
<p class="site-subtitle">朝日・毎日・讀賣｜政治・経済・国際｜各紙の記事を横3列で表示</p>
</div></header>
<main>
  <div class="toolbar">
    <div class="categories" role="group" aria-label="ニュース分野">
      <button type="button" data-category="政治" aria-pressed="true">政治</button>
      <button type="button" data-category="経済" aria-pressed="false">経済</button>
      <button type="button" data-category="国際" aria-pressed="false">国際</button>
    </div>
    <div class="edition-wrap"><label for="edition">閲覧する配信</label>
      <select id="edition"><option value="latest.json">自動取得の最新版</option><option value="snapshot-20261016-1700.json">10月16日17時の試作</option></select>
    </div>
  </div>
  <div id="notices" aria-live="polite"></div>
  <p class="hint" id="swipe-hint" hidden>表は左右にスクロールできます。左から「朝日 → 毎日 → 讀賣」です。</p>
  <div id="content" aria-live="polite"><div class="sheet loading">記事データを読み込んでいます。</div></div>
  <p class="info">各列はそれぞれの新聞の記事一覧です。横に並ぶ記事が同じ事件を扱うとは限りません。公開見出し・説明文のみを表示し、有料本文や掲載順位は推測しません。読売の日時はYahoo!ニュースの配信日時です。</p>
</main>
<script>
'use strict';
const PUBLISHERS=[{key:'朝日',label:'朝日新聞'},{key:'毎日',label:'毎日新聞'},{key:'読売',label:'讀賣新聞'}];
const state={category:'政治',data:null};
const edition=document.getElementById('edition');
const content=document.getElementById('content');
const notices=document.getElementById('notices');
function el(tag,cls,txt){let x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=String(txt);return x;}
function fmt(value){
  if(!value||value==='確認できず')return '確認できず';
  let date=new Date(value);
  return Number.isNaN(date.getTime())?String(value):date.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function validArticleURL(value){
  if(typeof value!=='string')return null;
  try{let u=new URL(value);return u.protocol==='https:'?u.href:null;}catch{return null;}
}
function makeArticle(a){
  const box=el('article','story');
  const h=el('h3','story-title');const link=validArticleURL(a.url);
  if(link){let x=el('a','',a.title||'見出しを確認できず');x.href=link;x.target='_blank';x.rel='noopener noreferrer';h.append(x);}
  else{h.textContent=(a.title||'見出しを確認できず')+'（リンク未確認）';}
  box.append(h,el('p','summary',a.description||'確認できず'));
  const when=a.paper==='読売'?'Yahoo配信日時':'公開日時';
  box.append(el('div','meta',when+'：'+fmt(a.published)+' ／ 有料表示：'+(a.paid||'確認できず')));
  return box;
}
function show(){
  if(!state.data)return;
  const d=state.data;notices.replaceChildren();content.replaceChildren();
  const notice=el('div','notice');
  if(d.snapshot){notice.append(el('strong','', '試作データ：'),document.createTextNode('10月16日のチャット配信を再構成した記録です。元記事は再検証していません。'));}
  else{notice.append(el('strong','', '取得日時：'),document.createTextNode(fmt(d.fetched_at)+'（日本時間）。取得できた公開情報を表示しています。'));}
  notices.append(notice);
  if(Array.isArray(d.errors)&&d.errors.length){
    const details=el('details');details.append(el('summary','','取得上の問題・未確認事項（'+d.errors.length+'件）'));
    d.errors.forEach(x=>{const category=x.category&&x.category!=='共通'?'・'+x.category:'';details.append(el('p','',String(x.paper||'取得元不明')+category+'：'+String(x.reason||'理由未確認')));});
    notices.append(details);
  }
  const all=Array.isArray(d.articles)?d.articles:[];
  const articles=PUBLISHERS.map(p=>all.filter(a=>a&&a.paper===p.key&&a.category===state.category).slice(0,7));
  const wrapper=el('div','sheet'), scroller=el('div','sheet-scroll'),table=el('table');
  table.setAttribute('aria-label',state.category+'の朝日・毎日・讀賣の記事一覧');
  const thead=el('thead'),headerRow=el('tr');
  PUBLISHERS.forEach((p,i)=>{const th=el('th');th.scope='col';th.append(document.createTextNode(p.label),el('span','count',articles[i].length+'本'));headerRow.append(th);});
  thead.append(headerRow);table.append(thead);
  const tbody=el('tbody');
  const rowCount=Math.max(1,...articles.map(x=>x.length));
  for(let row=0;row<rowCount;row++){
    const tr=el('tr');
    articles.forEach(list=>{
      const td=el('td');
      if(list[row])td.append(makeArticle(list[row]));
      else if(row===0&&!list.length)td.append(el('p','empty','該当記事なし／取得できず'));
      tr.append(td);
    });
    tbody.append(tr);
  }
  table.append(tbody);scroller.append(table);wrapper.append(scroller);content.append(wrapper);
}
async function load(){
  const choice=edition.value;
  notices.replaceChildren();content.replaceChildren(el('div','sheet loading','記事データを読み込んでいます。'));
  try{
    const response=await fetch('data/'+choice+'?v='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(edition.value!==choice)return;
    if(!data||!Array.isArray(data.articles))throw new Error('記事データの形式を確認できません');
    state.data=data;show();
  }catch(e){
    if(edition.value!==choice)return;
    state.data=null;content.replaceChildren(el('p','error','記事データを読み込めませんでした：'+e.message));
  }
}
document.querySelectorAll('[data-category]').forEach(btn=>btn.addEventListener('click',()=>{
  state.category=btn.dataset.category;
  document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
  show();
}));
edition.addEventListener('change',load);
const mobile=window.matchMedia('(max-width: 700px)');
function updateHint(){document.getElementById('swipe-hint').hidden=!mobile.matches;}
updateHint();mobile.addEventListener?.('change',updateHint);
load();
</script>
</body>
</html>
